<html lang="en">
<head>
<meta charset="UTF-8">

<body data-page="archive">
<script>document.write(LB.header('archive'))</script>
<div class="page-head"><div class="wrap">
  <div class="breadcrumb"><a href="home.html">Home</a><span class="sep">/</span><span>Archive</span></div>
  <span class="label">From the Vault</span>
  <h1>Archive</h1>
  <p>Pieces recently placed into private collections — every one now sold out. Spot something you own among them? We&rsquo;re always buying; send it our way for a fair, confidential offer.</p>
</div></div>
<section class="sold-sec"><div class="wrap">
  <div class="arr-head">
    <div class="l"><span class="label">Sold &amp; Settled</span><h2>Recently Placed</h2></div>
    <div class="cta-row"><a href="Sell to Us.html" class="btn btn-line">Offer Us an Item</a></div>
  </div>
  <div class="sold-grid" id="soldGrid"></div>
  <div class="loadmore-row"><button class="btn btn-line" id="loadMore" type="button">Load More</button><span class="rem" id="rem"></span></div>
</div></section>
<script>document.write(LB.footer())</script>
<script>

const items=[
 {img:"assets/col-southern-electric.jpg",e:"Bond · 1960",h:"Southern Electric Generating Co."},
 {img:"assets/col-broadway-rr.jpg",e:"Bond · New York, 1884",h:"Broadway &amp; Seventh Ave. Railroad"},
 {img:"assets/col-midwest-realty.jpg",e:"Stock · Utah, 1975",h:"Midwest Realty &amp; Finance, Inc."},
 {img:"assets/col-baltimore-ohio.jpg",e:"Stock · 1958 · Signed",h:"Baltimore &amp; Ohio Railroad Co."},
 {img:"assets/col-hawaiian-bell.jpg",e:"Stock · Honolulu, 1880",h:"Hawaiian Bell Telephone Company"},
 {img:"assets/col-china-book.jpg",e:"Reference · Compendium",h:"Historic Foreign Bonds of China"},
 {img:"assets/col-southern-electric.jpg",e:"Bond · 1962",h:"Southern Electric Generating Co."},
 {img:"assets/col-midwest-realty.jpg",e:"Stock · Utah, 1974",h:"Midwest Realty &amp; Finance"},
 {img:"assets/col-broadway-rr.jpg",e:"Bond · 1884",h:"Broadway &amp; Seventh Ave. Railroad"},
 {img:"assets/col-baltimore-ohio.jpg",e:"Stock · 1955",h:"Baltimore &amp; Ohio Railroad Co."},
 {img:"assets/col-hawaiian-bell.jpg",e:"Stock · 1880",h:"Hawaiian Bell Telephone Co."},
 {img:"assets/col-china-book.jpg",e:"Reference",h:"Scripophily Reference Library"},
];
const sg=document.getElementById('soldGrid'); const START=8,BATCH=4; let shown=START;
function render(){
 sg.innerHTML=items.slice(0,shown).map(s=>`<a href="#" class="soldcard"><div class="sold-img"><div class="sold-ph"><img src="${s.img}" alt="${s.h.replace(/&amp;/g,'&')}" loading="lazy"></div></div><div class="sold-cap"><span class="e">${s.e}</span><h4>${s.h}</h4><div class="sold-acts"><button class="btn btn-line" type="button">Ask a Question</button><button class="btn btn-navy" type="button">Notify Me</button></div></div></a>`).join('');
 const left=items.length-shown, btn=document.getElementById('loadMore'), rem=document.getElementById('rem');
 if(left<=0){btn.style.display='none';rem.textContent='Showing all '+items.length+' pieces';}else{rem.textContent=left+' more in the archive';}
}
document.getElementById('loadMore').addEventListener('click',()=>{shown+=BATCH;render();});
render();
</script>
</body>
