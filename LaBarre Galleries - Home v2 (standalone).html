document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"37a4b188-b8cc-46a3-a5e6-d4db6925c7b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"06dfdb4e-bb76-4200-a1fa-c9bf503204f9\"><\u002Fscript>\n<style>\n  :root{\n    --paper:#ffffff;\n    --paper-2:#f8f1df;\n    --paper-3:#f3ead4;\n    --card:#ffffff;\n    --ink:#1f2738;\n    --navy:#1d2c4d;\n    --gold:#a8842f;\n    --gold-2:#bd9a4f;\n    --gold-soft:#cbb277;\n    --oxblood:#7c2d2a;\n    --muted:#867d69;\n    --muted-2:#a59c86;\n    --line:#e6ddc7;\n    --line-2:#ded3b9;\n    --disp:\"Libre Caslon Display\", Georgia, serif;\n    --serif:\"EB Garamond\", Georgia, serif;\n    --sans:\"Hanken Grotesk\", system-ui, sans-serif;\n    --mono:\"IBM Plex Mono\", ui-monospace, monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html{scroll-behavior:smooth;}\n  body{\n    font-family:var(--serif);\n    color:var(--ink);\n    background:var(--paper);\n    -webkit-font-smoothing:antialiased;\n    font-size:18px;line-height:1.65;\n  }\n  img{display:block;max-width:100%;}\n  a{color:inherit;text-decoration:none;}\n  .wrap{max-width:1240px;margin:0 auto;padding:0 48px;}\n\n  .label{\n    font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;\n    color:var(--gold);font-weight:500;\n  }\n  .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:600;}\n\n  /* hairline ornament */\n  .orn{display:flex;align-items:center;gap:13px;color:var(--gold-2);}\n  .orn .ln{height:1px;flex:1;background:var(--line-2);}\n  .orn .dia{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg);flex:none;}\n\n  /* ===== UTILITY STRIP ===== */\n  .util{border-bottom:1px solid var(--line);background:var(--paper);}\n  .util .wrap{display:flex;justify-content:space-between;align-items:center;height:42px;}\n  .util .l{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}\n  .util .r{display:flex;gap:26px;font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;color:var(--muted);}\n  .util .r a{transition:color .2s;}\n  .util .r a:hover{color:var(--gold);}\n\n  /* ===== MASTHEAD ===== */\n  header.mast{background:var(--paper);position:relative;z-index:40;}\n  .mast-top{display:flex;flex-direction:column;align-items:center;padding:30px 0 26px;}\n  .crest{border:1px solid var(--line-2);padding:7px;background:#fff;box-shadow:0 2px 0 var(--paper-3);}\n  .crest img{height:78px;width:auto;display:block;}\n  .mast-actions{position:absolute;top:30px;right:48px;display:flex;gap:8px;}\n  .mast-actions.left{right:auto;left:48px;}\n  .ibtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink);background:transparent;cursor:pointer;transition:all .2s;}\n  .ibtn:hover{border-color:var(--gold);color:var(--gold);}\n  .cartwrap{position:relative;}\n  .cartwrap .c{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--oxblood);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center;}\n\n  /* nav row */\n  nav.cats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:38;transition:box-shadow .3s,background .3s;}\n  nav.cats.stuck{box-shadow:0 8px 22px -16px rgba(31,39,56,.4);background:rgba(255,255,255,.96);backdrop-filter:blur(6px);}\n  nav.cats .wrap{display:flex;justify-content:center;gap:42px;height:56px;align-items:center;}\n  nav.cats a{font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:500;position:relative;padding:4px 0;transition:color .2s;}\n  nav.cats a::after{content:\"\";position:absolute;left:50%;right:50%;bottom:-1px;height:1.5px;background:var(--gold);transition:all .26s ease;}\n  nav.cats a:hover{color:var(--gold);}\n  nav.cats a:hover::after{left:0;right:0;}\n\n  /* ===== PROMINENT SEARCH BAND ===== */\n  .searchband{background:var(--paper-2);border-bottom:1px solid var(--line);padding:28px 0 26px;}\n  .searchband .lbl{display:flex;align-items:center;gap:12px;margin-bottom:14px;}\n  .searchband .lbl .t{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500;white-space:nowrap;}\n  .searchband .lbl .ln{height:1px;flex:1;background:var(--line-2);}\n  .bigsearch{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--gold);padding:10px 10px 10px 24px;box-shadow:0 12px 30px -20px rgba(168,132,47,.55);transition:box-shadow .25s,border-color .25s,transform .25s;}\n  .bigsearch:hover,.bigsearch:focus-within{box-shadow:0 18px 40px -18px rgba(168,132,47,.7);border-color:var(--gold-2);transform:translateY(-1px);}\n  .bigsearch > svg{flex:none;color:var(--gold);}\n  .bigsearch input{flex:1;border:none;background:transparent;font-family:var(--disp);font-size:27px;color:var(--ink);outline:none;padding:8px 0;}\n  .bigsearch input::placeholder{color:var(--muted-2);}\n  .bigsearch button{flex:none;align-self:stretch;}\n  .searchhints{display:flex;align-items:center;gap:14px;margin-top:15px;flex-wrap:wrap;}\n  .searchhints .h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);}\n  .searchhints a{cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--navy);border-bottom:1px solid var(--line-2);padding-bottom:1px;transition:color .2s,border-color .2s;}\n  .searchhints a:hover{color:var(--gold);border-color:var(--gold);}\n\n  /* ===== HERO ===== */\n  .hero{padding:84px 0 90px;position:relative;overflow:hidden;}\n  .hero .wrap{display:grid;grid-template-columns:1.04fr 1fr;gap:72px;align-items:center;}\n  .hero .lead .label{display:inline-block;margin-bottom:24px;}\n  .hero h1{font-family:var(--disp);font-size:56px;line-height:1.08;letter-spacing:.004em;color:var(--ink);margin-bottom:26px;font-weight:400;text-wrap:balance;}\n  .hero h1 .it{font-family:var(--serif);font-style:italic;color:var(--gold);font-weight:500;}\n  .hero .lede{font-size:20px;line-height:1.7;color:#4c4636;max-width:44ch;margin-bottom:30px;}\n  .hero .meta{display:flex;align-items:stretch;margin-bottom:36px;padding:20px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);}\n  .hero .meta div.cell{display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 36px;}\n  .hero .meta div.cell:first-child{padding-left:0;}\n  .hero .meta div.cell:not(:first-child){border-left:1px solid var(--line);}\n  .hero .meta .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin:0;line-height:1;}\n  .hero .meta .v{font-family:var(--disp);font-size:22px;color:var(--ink);line-height:1;}\n  .cta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}\n\n  .btn{font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:16px 30px;cursor:pointer;transition:all .22s;display:inline-flex;align-items:center;gap:10px;border:1px solid transparent;}\n  .btn-navy{background:var(--navy);color:var(--paper);}\n  .btn-navy:hover{background:#142038;transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(29,44,77,.7);}\n  .btn-line{background:transparent;color:var(--ink);border-color:var(--line-2);}\n  .btn-line:hover{border-color:var(--gold);color:var(--gold);}\n  .btn-gold{background:var(--gold);color:#fff;}\n  .btn-gold:hover{background:var(--gold-2);}\n\n  /* hero frame */\n  .frame{position:relative;}\n  .frame .mat{background:#fff;padding:20px;border:1px solid var(--line-2);box-shadow:0 30px 70px -34px rgba(31,39,56,.45);position:relative;}\n  .frame .mat::after{content:\"\";position:absolute;inset:11px;border:1px solid var(--line);pointer-events:none;}\n  .frame image-slot{width:100%;height:500px;}\n  .frame .seal{position:absolute;z-index:5;right:-16px;top:-16px;width:92px;height:92px;border-radius:50%;background:var(--navy);border:1px solid var(--gold);display:grid;place-items:center;text-align:center;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);}\n  .frame .seal span{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#fff;line-height:1.5;}\n  .frame .cap{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;}\n  .frame .cap .t{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);}\n  .frame .cap .n{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);white-space:nowrap;}\n\n  /* ===== SECTION SHELL ===== */\n  section{padding:104px 0;}\n  .shead{text-align:center;max-width:640px;margin:0 auto 60px;}\n  .shead .label{display:block;margin-bottom:18px;}\n  .shead .orn{justify-content:center;margin-bottom:20px;}\n  .shead .orn .ln{max-width:70px;}\n  .shead h2{font-family:var(--disp);font-size:48px;line-height:1.06;color:var(--ink);margin-bottom:14px;font-weight:400;}\n  .shead p{color:var(--muted);font-size:18px;}\n\n  /* ===== CATEGORIES (catalog plates) ===== */\n  .cats-sec{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}\n  .plate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:46px 40px;}\n  .plate{cursor:pointer;}\n  .plate .imgbox{position:relative;background:var(--card);border:1px solid var(--line-2);padding:14px;overflow:hidden;}\n  .plate .imgbox::after{content:\"\";position:absolute;inset:7px;border:1px solid var(--line);pointer-events:none;z-index:2;}\n  .plate image-slot{width:100%;height:230px;transition:transform .65s cubic-bezier(.2,.7,.2,1);}\n  .plate:hover image-slot{transform:scale(1.05);}\n  .plate .no{position:absolute;top:14px;left:14px;z-index:3;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gold);background:var(--card);padding:5px 9px;border:1px solid var(--line);}\n  .plate .cap{padding:20px 4px 0;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line-2);margin-top:18px;gap:14px;}\n  .plate .cap .ttl{font-family:var(--disp);font-size:25px;line-height:1.1;color:var(--ink);transition:color .2s;}\n  .plate:hover .cap .ttl{color:var(--gold);}\n  .plate .cap .cnt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;padding-bottom:4px;}\n\n  /* ===== ERA TIMELINE ===== */\n  .era-sec{background:var(--paper);}\n  .timeline{position:relative;margin-top:30px;padding:0 10px;}\n  .timeline .axis{position:absolute;left:0;right:0;top:46px;height:1px;background:var(--line-2);}\n  .era-row{display:grid;grid-template-columns:repeat(6,1fr);position:relative;}\n  .era{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;padding-top:0;}\n  .era .yr{font-family:var(--disp);font-size:34px;color:var(--ink);line-height:1;height:46px;display:flex;align-items:flex-start;transition:color .25s,transform .25s;}\n  .era .node{width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid var(--gold);margin:8px 0 16px;transition:all .25s;position:relative;z-index:2;}\n  .era .nm{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink);margin-bottom:5px;}\n  .era .sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);}\n  .era:hover .yr{color:var(--gold);transform:translateY(-3px);}\n  .era:hover .node{background:var(--gold);transform:scale(1.25);box-shadow:0 0 0 5px rgba(168,132,47,.14);}\n\n  /* ===== ARRIVALS ===== */\n  .arr-sec{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}\n  .arr-head{display:flex;justify-con
